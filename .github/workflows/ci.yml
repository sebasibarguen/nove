# ABOUTME: CI pipeline for the Nove monorepo.
# ABOUTME: Runs linting, type checking, and tests for backend and frontend apps.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nove
          POSTGRES_PASSWORD: nove
          POSTGRES_DB: nove
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Lint
        working-directory: backend
        run: uv run ruff check src/ tests/

      - name: Format check
        working-directory: backend
        run: uv run ruff format --check src/ tests/

      - name: Type check (ty, non-blocking)
        working-directory: backend
        continue-on-error: true
        run: uv run ty check src/

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nove:nove@localhost:5432/nove
          JWT_SECRET_KEY: test-secret
        run: uv run pytest tests/ -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build

  lab-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-portal/package-lock.json

      - name: Install dependencies
        working-directory: lab-portal
        run: npm ci

      - name: Lint
        working-directory: lab-portal
        run: npm run lint

      - name: Type check
        working-directory: lab-portal
        run: npx tsc --noEmit

      - name: Build
        working-directory: lab-portal
        run: npm run build

  # Deploy the backend to Railway after the backend job passes on main.
  # Railway's GitHub integration has been unreliable; this explicit step is the
  # source of truth for "what's live".
  deploy-backend:
    needs: backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.com/install.sh | sh

      # Push the GitHub commit SHA + branch into Railway env so /health can
      # report which build is live. `railway up` doesn't carry git context;
      # without this, /health shows "commit": "dev" on every deploy.
      - name: Sync build identity to Railway env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variables --service backend \
            --set "RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}" \
            --set "RAILWAY_GIT_BRANCH=${{ github.ref_name }}" \
            --skip-deploys

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up backend --path-as-root --service backend --ci
